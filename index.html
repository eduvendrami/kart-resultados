<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Campeonato de Kart da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#f1f4f8; --text:#0f1724; --muted:#5d6878; --border:#dfe5ec;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e7f0fe; --good:#16803c; --bad:#c62828; --bad-soft:#fdecec; --purple:#7c3aed;
  --shadow:0 1px 2px rgba(15,23,36,.06),0 4px 14px rgba(15,23,36,.05);
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif; --font-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.readonly .actions label,body.readonly .race-tools,body.readonly [data-rtab="notas"]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:3px solid var(--accent)}
h1{margin:0;font-size:20px}
h2{margin:0 0 10px;font-size:15px}
h3{margin:16px 0 6px;font-size:13px}
.db{font-size:12px;font-weight:500;margin-left:10px;padding:2px 8px;border-radius:99px;vertical-align:middle}
.db.ok{color:var(--good);border:1px solid var(--good)}
.db.warn{color:var(--bad);border:1px solid var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
main{max-width:1150px;margin:0 auto;padding:16px 20px}
@media (max-width:860px){main{padding:12px 16px}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.hint{color:var(--muted);font-size:12px;margin:6px 0}
.small{font-size:12px;color:var(--muted)}
.picker{display:flex;align-items:center;gap:8px;font-weight:600}
#content{display:flex;flex-direction:column;gap:16px;min-width:0}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:60px 20px;text-align:center;color:var(--muted);background:var(--panel)}
body.dragging .dropzone,body.dragging .panel{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.card .lbl{color:var(--muted);font-size:12px}
.card .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{color:var(--muted);font-size:12px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-head h2{margin:0}
select,input[type=date],input[type=text]{padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.chart-wrap{position:relative;height:340px}
.lapchart{position:relative;height:230px;margin:8px 0}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.evo td{vertical-align:top}
.evo td.sum{background:var(--bg)}
.d{display:block;font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)}
.purple{color:var(--purple);font-weight:700}
.muted{color:var(--muted)}
details.race{border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
details.race summary{padding:10px 12px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
details.race summary b{font-size:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.tag.on{color:var(--accent);border-color:var(--accent)}
.race-body{padding:0 12px 12px}
.race-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px}
.stat .lbl{font-size:11px;color:var(--muted)}
.stat .val{font-weight:700;font-variant-numeric:tabular-nums}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px;align-items:end}
.notes label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.notes textarea{min-height:54px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;resize:vertical}
.notes .full{grid-column:1/-1}
tr.grp td{background:var(--bg);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.worst{background:var(--accent-soft)}
.tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;padding:0;border-radius:50%;
  border:1px solid var(--muted);background:none;color:var(--muted);font:700 10px/1 system-ui,sans-serif;cursor:help;vertical-align:middle;flex:none}
.tip:hover,.tip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#tipbox{position:fixed;z-index:20;max-width:310px;background:var(--text);color:var(--bg);font-size:12.5px;line-height:1.45;
  padding:9px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:400;text-transform:none;letter-spacing:0;white-space:normal}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90vw}
#toast.show{opacity:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
#race{max-width:100%}
.racehead{font-size:15px}
.kpi .val{font-size:26px}
.kpi-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
ol.focus{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.good{margin:0;padding-left:20px;color:var(--good)}
.view{display:flex;flex-direction:column;gap:16px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtab{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.subtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
details.laptable{margin-top:10px}
details.laptable summary{cursor:pointer;color:var(--accent);font-size:13px}
th.c{text-align:center}
/* ===== tema: painel de telemetria ===== */
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
h1{margin:0;font-family:var(--font-head);font-weight:700;font-size:20px;letter-spacing:-.2px;line-height:1.15;color:var(--text)}
h1 small{display:block;font-family:"Inter",sans-serif;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.db{font-size:11px;margin:5px 0 0;display:inline-block;font-weight:500}
.btn{border-radius:8px;font-weight:600;background:var(--panel);border:1px solid var(--border);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
main{padding-top:18px}
h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:-.1px}
h2{font-size:16px;color:var(--text)}
h3{font-size:14px;color:var(--text)}
.panel,.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.toolbar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.picker{font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=date],input[type=text],input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px}
.picker select{font-weight:600;font-size:14px;color:var(--text)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
/* números principais */
.card.kpi{position:relative;padding:14px 16px 14px 18px;overflow:hidden}
.card.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.card.kpi .lbl{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;font-size:11px}
.card.kpi .val{font-family:var(--font-num);font-weight:700;font-size:28px;letter-spacing:-.5px;color:var(--text);margin-top:2px}
.card.kpi .val.muted{color:var(--muted)}
.stat{background:var(--panel2);border:1px solid var(--border)}
.stat .val,.racehead b,td.r{font-family:var(--font-num)}
.stat .val{font-weight:700;font-size:15px}
td.r{font-size:13px}
.racehead{font-size:15px}
.racehead b{font-weight:700;color:var(--accent)}
#champName{font-family:var(--font-head);font-size:16px}
ol.focus li::marker{color:var(--accent);font-weight:700}
ul.good{color:var(--good)}
.subtab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:8px;font-weight:600}
.subtab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
th{color:var(--muted)}
td.worst{background:var(--bad-soft);color:var(--bad);font-weight:700}
.tip{border-color:var(--muted);color:var(--muted)}
.dropzone{background:var(--panel);border:2px dashed var(--accent);color:var(--text)}
details.laptable summary{color:var(--accent)}
.sm{display:none}
#champ table.stack td.rowhead,#driverPage table.stack td.rowhead{display:none}
.mainnav{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.mainnav{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.mainnav button{flex:1;min-width:140px;border:0;background:none;color:var(--muted);border-radius:9px;padding:9px 14px;
  font-family:var(--font-head);font-weight:600;font-size:14px;cursor:pointer}
.mainnav button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
tr.leader td{background:var(--accent-soft)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.backbtn{align-self:flex-start;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.backbtn:hover{border-color:var(--accent);color:var(--accent)}
.driverhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.driverhead .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--border)}
.driverhead h2{margin:0;font-size:22px}
.teamlogo{margin-left:auto;height:110px;width:200px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px}
.team{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.team i{width:4px;height:14px;border-radius:2px;background:var(--border);display:inline-block}
.medal{font-size:15px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rules ol{margin:0;padding-left:20px}
.ptsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.mlist{display:none;list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--border)}
.mlist li:last-child{border-bottom:0}
.mlist li.leader{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.mlist .pos{font-family:var(--font-num);font-weight:700;font-size:16px;text-align:center}
.mlist .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.mlist .who .linkbtn{font-size:16px;line-height:1.2}
.mlist .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.mlist .meta .purple{font-family:var(--font-num)}
.mlist .obs{font-size:12px;color:var(--bad)}
.mlist .pts{font-family:var(--font-num);font-weight:700;font-size:20px;text-align:right;line-height:1}
.mlist .pts small{display:block;font-family:"Inter",sans-serif;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* ===== celular ===== */
@media (max-width:640px){
  header{padding:12px 14px;gap:10px}
  .brand svg{width:34px;height:34px}
  h1{font-size:18px}
  h1 small{font-size:11px}
  .actions{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .actions .btn{padding:8px 6px;font-size:13px;text-align:center}
  .lg{display:none}
  .sm{display:inline}
  table.stack td.empty{display:none}
  main{padding:12px 10px}
  #content,.view{gap:12px}
  .panel{padding:12px;border-radius:10px}
  h2{font-size:14px}
  .toolbar{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
  .picker{flex-direction:column;align-items:stretch;gap:4px}
  .picker select{width:100%;padding:9px 10px;font-size:15px}
  .racehead{font-size:13px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .stat{padding:7px 9px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card.kpi{padding:11px 12px}
  .card.kpi .val{font-size:21px}
  .card.kpi .lbl{font-size:10px;letter-spacing:.5px}
  .card.kpi .sub{font-size:11px;line-height:1.3}
  ol.focus{padding-left:18px;gap:10px}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .subtab{flex:none;padding:7px 12px}
  .lapchart{height:200px}
  /* tabelas "stack": cada linha vira um cartão com rótulo e valor */
  table.stack, table.stack tbody{display:block}
  table.stack tr:first-child{display:none}
  table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--border)}
  table.stack td{display:flex;justify-content:space-between;gap:6px;border:0;padding:3px 0;white-space:normal;font-size:13px}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12px}
  #champ table.stack td.rowhead,#driverPage table.stack td.rowhead{display:flex;justify-content:flex-start;gap:8px}
  table.stack td.hide-sm{display:none!important}
  table.stack td.rowhead{grid-column:1/-1;font-family:var(--font-head);font-weight:600;color:var(--text);font-size:15px}
  table.stack td.rowhead::before{content:none}
  table.stack td.worst{background:none}
  .race-tools{flex-direction:column;align-items:stretch}
  .race-tools label{display:flex;justify-content:space-between;align-items:center}
  .notes{grid-template-columns:1fr 1fr}
  .mainnav button{min-width:0;font-size:12px;padding:9px 8px}
  #tipbox{max-width:calc(100vw - 24px)}
  .dtable{display:none}
  .mlist{display:block}
  #champCards{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  #champCards .card.kpi{padding:10px 10px 10px 13px}
  #champCards .card.kpi .val{font-size:19px}
  #champCards .card.kpi .sub{font-size:10.5px}
  table.stack td::before{font-family:"Inter",sans-serif}
  .driverhead h2{font-size:19px}
  .teamlogo{height:76px;width:120px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="10" fill="var(--accent)"/>
      <path d="M12 9v23" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="var(--accent-ink)"><rect x="13.5" y="10" width="5" height="5"/><rect x="23.5" y="10" width="5" height="5"/>
        <rect x="18.5" y="15" width="5" height="5"/><rect x="28.5" y="15" width="0" height="5"/><rect x="13.5" y="20" width="5" height="5"/><rect x="23.5" y="20" width="5" height="5"/></g>
      <path d="M13.5 10h15v15h-15z" fill="none" stroke="var(--accent-ink)" stroke-width="1.4"/>
    </svg>
    <h1>Campeonato de Kart da Família<small>Classificação no estilo Fórmula 1</small></h1>
  </div>
</header>

<main>
  <section id="content">
    <div id="driverPage" class="view" hidden></div>
    <div id="champ" class="view" hidden>
      <div id="champCards" class="kpis"></div>
      <div class="panel">
        <h2>Classificação geral <button type="button" class="tip" data-tip="champTable" aria-label="O que é isso?">?</button></h2>
        <div class="scroll dtable"><table class="stack" id="champTable"></table></div>
        <ol class="mlist" id="champList"></ol>
      </div>
      <div id="champStages"></div>
      <div class="panel">
        <h2>Regulamento</h2>
        <div id="champRules"></div>
      </div>
    </div>

    <div id="empty" class="dropzone">
      Nenhuma etapa registrada ainda.
    </div>

  </section>
</main>
<div id="toast"></div>

<script>
const STORE_KEY = 'kart-resultados-v1';
// Pilotos principais (código entre colchetes no arquivo do kartódromo). Só eles são guardados na importação.
const TRACKED = [
  {code:'240461', name:'EDUARDO VENDRAMI'},
  {code:'245424', name:'ISAAC LUCENA'},
  {code:'245426', name:'RENATA FARIAS'},
  {code:'245421', name:'REBECA RODRIGUES'},
  {code:'214706', name:'VINICIUS ROSA ALVES'},
];
const SLOW_LAP = 1.2;   // voltas acima de 120% da melhor não entram na média/consistência

let state = load();
let dbOnline = false;   // true quando o site foi aberto pelo server.py (banco kart.db)
let readOnly = false;   // true na versão publicada (GitHub Pages), que lê data.json

/* ---------- persistência ---------- */
// As corridas ficam no banco (kart.db, via server.py). O navegador só guarda preferências,
// ou tudo, se o site for aberto sem o servidor.
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && Array.isArray(s.races)) return {races:s.races, view:s.view||null, race:s.race||null, page:s.page||'analise'};
  }catch(e){}
  return {races:[], view:null, race:null};
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(dbOnline || readOnly ? {...state, races:[], openGroup:null} : {...state, openGroup:null})); }
  catch(e){ if(!dbOnline) toast('Não foi possível salvar no navegador.'); }
}
async function api(method, path, body){
  const res = await fetch('/api' + path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if(!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `erro ${res.status}`);
  return res.json();
}
async function dbPut(race){ if(dbOnline) await api('PUT', '/races/' + encodeURIComponent(race.id), race); }
async function dbDelete(id){ if(dbOnline) await api('DELETE', '/races/' + encodeURIComponent(id)); }
const dbFail = e => toast('Erro ao salvar no banco: ' + e.message);

async function connectDb(){
  if(location.protocol.startsWith('http')){
    try{
      const local = state.races;
      state.races = await api('GET', '/races');
      dbOnline = true;
      // corridas que estavam só no navegador vão para o banco
      const novas = local.filter(r => !state.races.some(x => x.id === r.id));
      for(const r of novas){ await dbPut(r); state.races.push(r); }
      if(novas.length) toast(`${novas.length} corrida(s) do navegador copiada(s) para o banco`);
    }catch(e){ dbOnline = false; }
  }
  // sem servidor: versão publicada, com a cópia dos dados em data.json (somente leitura)
  if(!dbOnline && location.protocol.startsWith('http')){
    try{
      const res = await fetch('data.json', {cache:'no-store'});
      if(res.ok){
        const data = await res.json();
        state.races = data.races;
        readOnly = true;
        document.body.classList.add('readonly');
      }
    }catch(e){}
  }
}

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim().replace(/\.$/,'');
const pad = n => String(n).padStart(2,'0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const brDate = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(2,4) : '?';
const mean = a => a.reduce((s,v) => s+v, 0) / a.length;
const stdev = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v-m)**2))); };

function parseTime(s){
  s = (s||'').trim();
  if(!/^\d+(:\d+)*([.,]\d+)?$/.test(s)) return null;
  return s.replace(',','.').split(':').reduce((a,p) => a*60 + parseFloat(p), 0);
}
function parseNum(s){
  const n = parseFloat((s||'').trim().replace(',','.'));
  return isFinite(n) ? n : null;
}
function fmtTime(sec){
  if(sec==null) return '—';
  if(sec < 60) return sec.toFixed(3);
  const m = Math.floor(sec/60), r = sec - m*60;
  return `${m}:${r.toFixed(3).padStart(6,'0')}`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 4500);
}
const keyOf = x => x.code ? 'c'+x.code : 'n'+norm(x.name);
const raceLabel = r => `${brDate(r.date)} ${r.time}`;
const sortedRaces = () => [...state.races].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
const fastest = r => r.fastest ?? Math.min(...r.results.map(x => x.best).filter(v => v!=null));
const fieldSize = r => r.fieldSize ?? r.results.length;
// % do grid que terminou atrás: 100% = venceu, 0% = último
const relPos = (x, r) => x?.pos && fieldSize(r) > 1 ? (fieldSize(r) - x.pos) / (fieldSize(r) - 1) * 100 : null;
const pctOff = (x,r) => x.best==null ? null : (x.best/fastest(r) - 1) * 100;
const KIND_LABEL = {prova:'prova', tomada:'qualify'};   // "tomada de tempo" nos arquivos do kartódromo
const kindOf = r => r.kind || (/TOMADA/i.test(r.title||'') ? 'tomada' : 'prova');
const sessionOf = r => r.session || ((r.title||'').match(/(?:PROVA|TOMADA)\s*(\d+)/i)||[])[1] || '';
// prova e tomada do mesmo horário formam um "evento"; o id é fixo, mesmo se data/circuito forem editados
const groupKey = r => r.id.replace(/TOMADA|PROVA/i, '#');

// Completa os dados gerais da sessão (grid, vencedor, volta mais rápida, referências do grid)
function prepSession(race){
  if(race.fieldSize == null){
    const best = Math.min(...race.results.map(x => x.best).filter(v => v!=null));
    const winner = race.results.find(x => x.pos===1) || race.results[0];
    race.fieldSize = race.results.length;
    race.fastest = best;
    race.fastestName = race.results.find(x => x.best===best)?.name || '';
    race.winnerName = winner?.name || '';
    race.ref = {...sessionRef(race.results), ...(race.ref || {})};
  }
  race.kind = kindOf(race);
  race.session = sessionOf(race);
  race.results = race.results.filter(isTracked);
  return race;
}
const isTracked = x => TRACKED.some(t => x.code ? x.code === t.code : norm(x.name).startsWith(norm(t.name)));

// números de referência do grid inteiro: melhores setores e velocidade
function sessionRef(results){
  const min = k => { const v = results.map(x => x[k]).filter(v => v != null); return v.length ? Math.min(...v) : null; };
  const tops = results.map(x => x.top).filter(v => v != null);
  const ref = {s1: min('s1'), s2: min('s2'), s3: min('s3')};
  if(tops.length){ ref.topAvg = +mean(tops).toFixed(2); ref.topMax = Math.max(...tops); }
  return ref;
}

/* ---------- leitura dos arquivos do kartódromo ---------- */
const RESULT_COLS = {
  pos:['pos'], no:['no'], code:['codigo'], name:['nome'], comment:['comentarios'],
  laps:['voltas'], best:['melhor tempo'], total:['total tempo'], diff:['diff'], gap:['espaco'],
  s1:['s1 melhor vlt'], s2:['s2 melhor vlt'], s3:['s3 melhor vlt'], top:['sfspd melhor vlt'],
  avg:['velocidade media'], bestSpeed:['melhor veloc'], bestLapNo:['na volta']
};
const LAP_COLS = {
  tod:['hora do dia'], lap:['volta'], leaderLap:['volta do lider'], time:['volta tm'], speed:['velocidade'],
  sf:['sfspd'], sfTime:['sfspd tm'], s1:['s1'], s2:['s2'], s3:['s3']
};

function headerIndex(table, cols){
  const headRow = [...table.querySelectorAll('tr')].find(tr => tr.querySelector('th'));
  const headers = [...headRow.children].map(c => norm(c.textContent));
  const idx = {};
  for(const [k,names] of Object.entries(cols)){
    const i = headers.findIndex(h => names.includes(h));
    if(i >= 0) idx[k] = i;
  }
  return idx;
}
const dataTable = doc => [...doc.querySelectorAll('table')].find(t => t.querySelector('th'));
const cellText = td => (td?.textContent || '').replace(/ /g,' ').trim();

// cabeçalho comum: circuito, título, horário e data
function sessionMeta(doc, fileName){
  const header = (doc.querySelector('.headerbig')?.textContent || '').replace(/\s+/g,' ').trim();
  // "... CIRCUITO - 101"; alguns arquivos trazem só o nome do traçado no fim (ex.: "GRANJA VIANA  Nova pista")
  const track = (header.match(/CIRCUITO\s*-?\s*([\w-]+)/i)||[])[1]
             || header.replace(/^.*?(GRANJA VIANA|KGV RACE TRACKS)/i, '').replace(/\s+a funcionar/i, '').trim() || '?';
  const venue = header.replace(/\s*CIRCUITO.*$/i,'').replace(/\s+a funcionar\b/i,'').trim();
  const title = (doc.querySelector('.headersmall')?.textContent || doc.title || fileName)
                  .replace(/\s+/g,' ').replace(/^(Resultados|Tempos de volta) de\s*/i,'').trim();
  const hm = title.match(/(\d{1,2}):(\d{2})\s*$/);
  const time = hm ? pad(hm[1])+':'+hm[2] : '';
  // data: vem de "Gerada em dd/mm/aaaa hh:mm"; se foi gerada depois da meia-noite, a corrida foi no dia anterior
  let date = toISO(new Date());
  const gm = (doc.querySelector('.save')?.textContent || '').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(gm){
    const d = new Date(+gm[3], +gm[2]-1, +gm[1]);
    if(time && `${gm[4]}:${gm[5]}` < time) d.setDate(d.getDate()-1);
    date = toISO(d);
  }
  return { id:[date,time,track,title].join('|'), title, venue, track, date, time, fileName };
}
const fileType = doc => /^tempos de volta/.test(norm(doc.querySelector('.headersmall')?.textContent || doc.title)) ? 'laps' : 'results';

function parseResults(doc, fileName){
  const table = dataTable(doc);
  if(!table) throw new Error('tabela de resultados não encontrada');
  const idx = headerIndex(table, RESULT_COLS);
  if(idx.pos==null || idx.name==null) throw new Error('colunas Pos/Nome não encontradas');
  const results = [];
  for(const tr of table.querySelectorAll('tr')){
    if(tr.querySelector('th')) continue;
    const cells = [...tr.children].map(cellText);
    const get = k => idx[k]!=null ? (cells[idx[k]]||'') : '';
    let name = get('name');
    let code = (get('code').match(/\d+/)||[])[0] || null;
    const pre = name.match(/^\[(\d+)\]\s*/);          // às vezes o código vem grudado no nome
    if(pre){ code = code || pre[1]; name = name.slice(pre[0].length); }
    name = name.replace(/\s+/g,' ').trim();
    if(!name) continue;
    results.push({
      pos: parseInt(get('pos')) || null, no: get('no'), code, name, comment: get('comment'),
      laps: parseInt(get('laps')) || 0, best: parseTime(get('best')), total: parseTime(get('total')),
      diff: get('diff'), gap: get('gap'), s1: parseTime(get('s1')), s2: parseTime(get('s2')), s3: parseTime(get('s3')),
      top: parseNum(get('top')), avg: parseNum(get('avg')), bestSpeed: parseNum(get('bestSpeed')), bestLapNo: parseInt(get('bestLapNo')) || null
    });
  }
  if(!results.length) throw new Error('nenhum piloto encontrado');
  return prepSession({ ...sessionMeta(doc, fileName), results });
}

function parseLaps(doc, fileName){
  const table = dataTable(doc);
  if(!table) throw new Error('tabela de voltas não encontrada');
  const idx = headerIndex(table, LAP_COLS);
  if(idx.lap==null || idx.time==null) throw new Error('colunas Volta/Volta Tm não encontradas');
  // o número da volta em azul marca passagem pelo box; o nome da classe muda entre arquivos, a cor não
  const pitClasses = new Set([...(doc.querySelector('style')?.textContent || '')
    .matchAll(/td\.(\w+)\s*\{[^}]*background-color:\s*rgb\(\s*23,\s*145,\s*217\s*\)/g)].map(m => m[1]));
  const blocks = []; let cur = null;
  for(const tr of table.querySelectorAll('tr')){
    if(tr.querySelector('th')) continue;
    const head = tr.querySelector('td[colspan]');
    if(head){   // "024 - NICOLAS COLANERI - RENTAL"
      const t = cellText(head).replace(/\s+/g,' ');
      const m = t.match(/^(\d+)\s*-\s*(.+?)\s*-\s*[^-]+$/);
      cur = {no: m ? m[1] : '', name: (m ? m[2] : t).replace(/^\[\d+\]\s*/, ''), laps: []};   // às vezes vem "[código] NOME"
      blocks.push(cur); continue;
    }
    if(!cur) continue;
    const tds = [...tr.children];
    const get = k => idx[k]!=null ? cellText(tds[idx[k]]) : '';
    const lap = parseInt(get('lap'));
    if(!lap) continue;
    cur.laps.push({
      lap, tod: get('tod'), leaderLap: parseInt(get('leaderLap')) || null, time: parseTime(get('time')),
      speed: parseNum(get('speed')), sf: parseNum(get('sf')), sfTime: parseTime(get('sfTime')),
      s1: parseTime(get('s1')), s2: parseTime(get('s2')), s3: parseTime(get('s3')),
      pit: [...(tds[idx.lap]?.classList || [])].some(c => pitClasses.has(c))
    });
  }
  if(!blocks.length) throw new Error('nenhum piloto encontrado');
  // referência do grid a partir do volta a volta de todos: melhores setores reais e velocidade máx. de cada um
  const all = blocks.flatMap(b => b.laps);
  const min = k => { const v = all.map(l => l[k]).filter(v => v != null); return v.length ? Math.min(...v) : null; };
  const tops = blocks.map(b => Math.max(...b.laps.map(l => l.sf ?? -1))).filter(v => v > 0);
  const ref = {s1: min('s1'), s2: min('s2'), s3: min('s3'), fromLaps: true};
  if(tops.length){ ref.topAvg = +mean(tops).toFixed(2); ref.topMax = Math.max(...tops); }
  return { ...sessionMeta(doc, fileName), blocks, ref };
}

// junta o tempo de voltas na sessão (prova ou tomada) já importada
async function attachLaps(lp){
  const kind = kindOf(lp);
  const race = state.races.find(r => r.id === lp.id)
            || state.races.find(r => kindOf(r) === kind && groupKey(r) === groupKey(lp));
  if(!race) throw new Error(`importe antes o arquivo de resultados dessa sessão (${KIND_LABEL[kind]})`);
  let n = 0;
  for(const x of race.results){
    const b = lp.blocks.find(b => +b.no === +x.no && norm(x.name).startsWith(norm(b.name).slice(0,5)))
           || lp.blocks.find(b => norm(x.name).startsWith(norm(b.name)) || norm(b.name).startsWith(norm(x.name)));
    if(b){ x.lapTimes = b.laps; n++; }
  }
  if(!n) throw new Error('nenhum piloto desse arquivo de voltas foi encontrado na sessão');
  race.ref = {...(race.ref || {}), ...lp.ref};
  await dbPut(race);
  return n;
}

// usada pelo Claude para importar arquivos; o site não tem mais botão de importar
async function importFiles(files){
  const docs = [];
  const errors = [];
  for(const f of files){
    try{ docs.push({f, doc: new DOMParser().parseFromString(await f.text(), 'text/html')}); }
    catch(e){ errors.push(`${f.name}: ${e.message}`); }
  }
  let added = 0, dup = 0, updated = 0, lapFiles = 0;
  // resultados (prova e tomada) primeiro, depois o tempo de voltas, que depende deles
  for(const {f, doc} of docs.filter(d => fileType(d.doc) === 'results')){
    try{
      const race = parseResults(doc, f.name);
            const old = state.races.find(r => r.id === race.id);
      if(old){
        // sessão já existe: só acrescenta pilotos que ainda não estavam nela
        // e completa a referência do grid, se essa sessão foi importada antes de existir
        const novos = race.results.filter(x => !old.results.some(y => keyOf(y) === keyOf(x)));
        const refNova = Object.keys(race.ref || {}).some(k => race.ref[k] != null && old.ref?.[k] == null);
        if(!novos.length && !refNova){ dup++; continue; }
        old.ref = {...(race.ref || {}), ...(old.ref || {})};
        old.results = [...old.results, ...novos].sort((a,b) => (a.pos ?? 999) - (b.pos ?? 999));
        await dbPut(old); updated++;
        continue;
      }
      await dbPut(race);
      state.races.push(race); added++;
    }catch(e){ errors.push(`${f.name}: ${e.message}`); }
  }
  for(const {f, doc} of docs.filter(d => fileType(d.doc) === 'laps')){
    try{ await attachLaps(parseLaps(doc, f.name)); lapFiles++; }
    catch(e){ errors.push(`${f.name}: ${e.message}`); }
  }
  if(added) state.race = null;   // abre na corrida mais recente
  save(); render();
  const parts = [];
  if(added) parts.push(`${added} sessão(ões) importada(s)`);
  if(updated) parts.push(`${updated} atualizada(s)`);
  if(lapFiles) parts.push(`tempo de voltas importado (${lapFiles} arquivo(s))`);
  if(dup) parts.push(`${dup} já existia(m)`);
  if(errors.length) parts.push(`erro em ${errors.join('; ')}`);
  toast(parts.join(' · ') || 'Nada importado');
}

// Completa campos que versões antigas das sessões salvas não tinham
function applyTracking(){
  for(const r of state.races){
    const n = r.results.length, complete = r.fieldSize != null && r.kind && r.session != null;
    prepSession(r);
    if(r.results.length !== n || !complete) dbPut(r).catch(dbFail);
  }
  for(const r of state.races.filter(r => !r.results.length)) dbDelete(r.id).catch(dbFail);
  state.races = state.races.filter(r => r.results.length);
  save();
}

/* ---------- dados do piloto ---------- */
function driverIndex(){
  const map = new Map();
  for(const r of state.races) for(const x of r.results){
    const k = keyOf(x);
    let d = map.get(k);
    if(!d){ d = {key:k, names:{}}; map.set(k,d); }
    d.names[x.name] = (d.names[x.name] || 0) + 1;
  }
  // o kartódromo às vezes corta o nome ("EDUARDO VENDRAMI LUCE"): usa o nome que mais aparece, e no empate o mais longo
  for(const d of map.values())
    d.name = Object.entries(d.names).sort((a,b) => b[1] - a[1] || b[0].length - a[0].length)[0][0];
  return map;
}

// estatísticas do volta a volta (r = sessão, para comparar com os melhores setores do grid)
function lapStats(x, r){
  const L = (x?.lapTimes || []).filter(l => l.time != null);
  if(!L.length) return null;
  // voltas marcadas em azul (box ou volta final incompleta) não contam como melhor volta
  const timed = L.filter(l => !l.pit);
  const best = Math.min(...(timed.length ? timed : L).map(l => l.time));
  const clean = L.filter(l => !l.pit && l.time <= best * SLOW_LAP);
  const minOf = k => { const v = L.map(l => l[k]).filter(v => v != null); return v.length ? Math.min(...v) : null; };
  const sec = {};
  for(const k of ['s1','s2','s3']){
    const b = minOf(k), v = clean.map(l => l[k]).filter(v => v != null), ref = r?.ref?.[k];
    sec[k] = {best: b, avg: v.length ? mean(v) : null, irr: v.length && b != null ? mean(v) - b : null,
              loss: b != null && ref != null ? b - ref : null, ref};
  }
  // ritmo: voltas válidas (sem a 1ª, que tem a largada) divididas em início, meio e fim
  const run = clean.filter(l => l.lap > 1), n = run.length;
  const third = (a,b) => { const p = run.slice(a,b); return p.length ? mean(p.map(l => l.time)) : null; };
  const thirds = n >= 3 ? [third(0, Math.round(n/3)), third(Math.round(n/3), Math.round(2*n/3)), third(Math.round(2*n/3), n)] : [null,null,null];
  const sfs = L.map(l => l.sf).filter(v => v != null);
  return {
    n: L.length, clean: clean.length, best, sec, thirds,
    avg: clean.length ? mean(clean.map(l => l.time)) : null,
    sd: clean.length > 1 ? stdev(clean.map(l => l.time)) : null,
    within: L.filter(l => !l.pit && l.time <= best + 0.5).length / L.length * 100,
    errors: L.filter(l => !l.pit && l.time > best * SLOW_LAP).length,
    lap1: L.find(l => l.lap === 1)?.time ?? null,
    s1: sec.s1.best, s2: sec.s2.best, s3: sec.s3.best,
    ideal: sec.s1.best!=null && sec.s2.best!=null && sec.s3.best!=null ? sec.s1.best+sec.s2.best+sec.s3.best : null,
    top: sfs.length ? Math.max(...sfs) : null,
    bestLap: L.find(l => l.time === best)?.lap
  };
}
const topOf = (x, r) => x?.top ?? lapStats(x, r)?.top ?? null;
const spdVsGrid = (x, r) => { const t = topOf(x, r), g = r?.ref?.topAvg; return t != null && g != null ? t - g : null; };

const F1_POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
// o campeonato usa só as etapas da planilha (campeonato.json); as provas importadas na Granja Viana

const shortName = code => { const n = nameOf('c' + code); return n.split(' ').slice(0, 2).map(w => w[0] + w.slice(1).toLowerCase()).join(' '); };

// todas as etapas: cada prova importada (só pilotos principais) + as da planilha (ex.: outro kartódromo)
function champStages(){
  const auto = !COUNT_IMPORTED_RACES ? [] : sortedRaces().filter(r => kindOf(r) === 'prova' && !EXCLUDED_RACES.includes(r.id)).map(r => {
    const rs = r.results.filter(x => x.code).sort((a,b) => (a.pos ?? 999) - (b.pos ?? 999));
    return {data:r.date, hora:r.time, kartodromo:'Granja Viana', circuito:r.track, sessao:r.session, fonte:'arquivo', fieldSize:fieldSize(r),
      resultados: rs.map((x,i) => ({codigo:x.code, posicao: x.pos ? i + 1 : null, posGeral:x.pos, melhorVolta:x.best, voltas:x.laps,
        velMax: topOf(x, r), batidas:null, punicoes:null, penalidade: x.comment || null, obs:null}))};
  });
  const manual = (champ?.etapas || []).map(e => ({data:e.data, hora:'', kartodromo:e.kartodromo, fonte:'planilha',
    resultados: e.resultados.filter(r => r.codigo).map(r => ({...r}))}));
  const all = [...auto, ...manual].sort((a,b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  all.forEach((e,i) => {

    for(const r of e.resultados) r.pontos = r.posicao ? (F1_POINTS[r.posicao - 1] || 0) : 0;

function standings(etapas){
  const map = new Map();
  for(const e of etapas) for(const r of e.resultados){
    const s = map.get(r.codigo) || {codigo:r.codigo, pts:0, pos:[], etapas:0, best:null, vel:null, batidas:0, punicoes:0};
    s.pts += r.pontos; s.etapas++;
    if(r.posicao) s.pos.push(r.posicao);
    if(r.melhorVolta != null && (s.best == null || r.melhorVolta < s.best)) s.best = r.melhorVolta;
    if(r.velMax != null && (s.vel == null || r.velMax > s.vel)) s.vel = r.velMax;
    s.batidas += r.batidas || 0; s.punicoes += r.punicoes || 0;
    map.set(r.codigo, s);
  }
  const count = (s, p) => s.pos.filter(x => x === p).length;
  // desempate como na F1: mais vitórias, depois mais 2º lugares, 3º lugares...
  return [...map.values()].map(s => ({...s, wins:count(s,1), podiums:s.pos.filter(p => p <= 3).length}))
    .sort((a,b) => {
      if(b.pts !== a.pts) return b.pts - a.pts;
      for(let p = 1; p <= 10; p++){ const d = count(b,p) - count(a,p); if(d) return d; }
      return (a.best ?? 1e9) - (b.best ?? 1e9) || (a.batidas + a.punicoes) - (b.batidas + b.punicoes);
    });
}

function renderChamp(){
  const etapas = champStages(), S = standings(etapas), last = etapas.at(-1);
  const card = (lbl, k, val, sub) => `<div class="card kpi"><div class="lbl">${lbl}${tip(k)}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const lead = S[0], second = S[1];
  const wins = S.filter(s => s.wins).sort((a,b) => b.wins - a.wins)[0];
  $('#champCards').innerHTML =
    (lead ? card('Líder', 'champLeader', esc(shortName(lead.codigo).split(' ')[0]), `${lead.pts} pts${second ? ` · ${lead.pts - second.pts} à frente de ${esc(shortName(second.codigo).split(' ')[0])}` : ''}`) : '') +
    card('Etapas', '', etapas.length, last ? `última: ${brDate(last.data)} · ${esc(last.kartodromo)}` : '') +
    (wins ? card('Mais vitórias', '', wins.wins, esc(shortName(wins.codigo))) : '');

  const medal = i => ['🥇','🥈','🥉'][i] || '';
  const c = (lbl, v) => `<td class="r" data-label="${lbl}"><span>${v}</span></td>`;
  $('#champTable').innerHTML = `<tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th class="r">Pontos</th><th class="r">Vitórias</th><th class="r">Pódios</th>
      <th class="r">Etapas</th><th class="r">Melhor posição</th></tr>` +
    S.map((s,i) => `<tr class="${i===0?'leader':''}"><td class="rowhead"><span class="medal">${medal(i)}</span> ${i+1}º · ${driverBtn(s.codigo)}</td>
      <td class="hide-sm"><span class="medal">${medal(i)}</span> ${i+1}º</td><td class="hide-sm">${driverBtn(s.codigo)}</td>
      <td data-label="Equipe"><span>${teamTag(s.codigo)}</span></td>
      ${c('Pontos', `<b>${s.pts}</b>`)}${c('Vitórias', s.wins)}${c('Pódios', s.podiums)}${c('Etapas', s.etapas)}${c('Melhor posição', ord(Math.min(...s.pos)))}</tr>`).join('');

  // celular: posição · nome e equipe · pontos (o resto fica no perfil do piloto)
  $('#champList').innerHTML = S.map((s,i) => `<li class="${i===0?'leader':''}">
      <span class="pos">${medal(i) || (i+1) + 'º'}</span>
      <span class="who">${driverBtn(s.codigo)}<span class="meta">${teamTag(s.codigo)}${s.wins ? `<span>${s.wins} vitória${s.wins > 1 ? 's' : ''}</span>` : ''}</span></span>
      <span class="pts">${s.pts}<small>pts</small></span></li>`).join('');

  $('#champStages').innerHTML = [...etapas].reverse().map(e => {
    const fast = Math.min(...e.resultados.map(r => r.melhorVolta ?? 1e9));
    const extra = e.resultados.some(r => r.batidas != null);
    return `<div class="panel"><h2>${esc(e.nome)} · ${brDate(e.data)} · ${esc(e.kartodromo)}${e.circuito ? ` <span class="small">circuito ${esc(e.circuito)}${e.sessao ? ' · prova ' + esc(e.sessao) : ''}</span>` : ''}</h2>
      <div class="scroll dtable"><table class="stack">
        <tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th class="r">Pontos</th><th class="r">Pos. geral${tip('champPosGeral')}</th><th class="r">Melhor volta</th>
            <th class="r">Voltas</th>${extra ? '<th class="r">Batidas</th><th class="r">Punições</th>' : ''}<th>Observações</th></tr>
        ${e.resultados.map(r => `<tr><td class="rowhead">${ord(r.posicao)} · ${driverBtn(r.codigo)}</td><td class="hide-sm">${r.posicao ? ord(r.posicao) : 'DQ'}</td>
          <td class="hide-sm">${driverBtn(r.codigo)}</td><td data-label="Equipe"><span>${teamTag(r.codigo)}</span></td>
          ${c('Pontos', `<b>${r.pontos}</b>`)}${c('Pos. geral', r.posGeral ? `${r.posGeral}º${e.fieldSize ? ` <span class="small">de ${e.fieldSize}</span>` : ''}` : '—')}
          <td class="r ${r.melhorVolta === fast ? 'purple' : ''}" data-label="Melhor volta"><span>${fmtTime(r.melhorVolta)}</span></td>
          ${c('Voltas', r.voltas ?? '—')}${extra ? c('Batidas', r.batidas ?? '—') + c('Punições', r.punicoes ?? '—') : ''}
          <td data-label="Obs." class="${r.penalidade || r.obs ? '' : 'empty'}"><span>${[r.penalidade && '⏱ ' + esc(r.penalidade), r.obs && esc(r.obs)].filter(Boolean).join(' · ') || '—'}</span></td></tr>`).join('')}
      </table></div>
      <ol class="mlist">${e.resultados.map(r => { const obs = [r.penalidade && '⏱ ' + esc(r.penalidade), r.obs && esc(r.obs)].filter(Boolean).join(' · ');
        return `<li><span class="pos">${r.posicao ? ord(r.posicao) : 'DQ'}</span>
        <span class="who">${driverBtn(r.codigo)}<span class="meta">${teamTag(r.codigo)}
          <span class="${r.melhorVolta === fast ? 'purple' : ''}">${fmtTime(r.melhorVolta)}</span>${r.posGeral ? `<span>${r.posGeral}º geral</span>` : ''}</span>
          ${obs ? `<span class="obs">${obs}</span>` : ''}</span>
        <span class="pts">${r.pontos}<small>pts</small></span></li>`; }).join('')}</ol>
      <p class="note">Posição e pontos contam só os pilotos do campeonato. Em roxo: volta mais rápida entre eles.${e.fonte === 'planilha' ? ' Etapa registrada na planilha.' : ''}</p></div>`;
  }).join('');

  $('#champRules').innerHTML = `<div class="rules">
    <div><h3>Pontuação por etapa (Fórmula 1)</h3><div class="ptsgrid">
      ${F1_POINTS.map((p,i) => `<div class="stat"><div class="lbl">${i+1}º lugar</div><div class="val">${p} pts</div></div>`).join('')}
      <div class="stat"><div class="lbl">11º+ / DQ</div><div class="val">0 pts</div></div></div>
      <p class="note">A posição é a ordem de chegada entre os pilotos do campeonato naquela corrida.</p></div>
    <div><h3>Critérios de desempate</h3><ol>${(champ.desempate || []).map(d => `<li>${esc(d)}</li>`).join('')}</ol></div></div>`;
}

const fullName = code => nameOf('c' + code).toLowerCase().replace(/(^|\s)\S/g, ch => ch.toUpperCase());
const driverBtn = code => `<button type="button" class="linkbtn" data-driver="${esc(code)}">${esc(shortName(code))}</button>`;

/* ---------- dados individuais do piloto ---------- */
function renderDriver(code){
  const etapas = champStages(), S = standings(etapas);
  const idx = S.findIndex(s => s.codigo === code), s = S[idx];
  const team = teamOf(code);
  const el = $('#driverPage');
  if(!s){ el.innerHTML = `<button type="button" class="backbtn" data-back>← Classificação</button><div class="panel">Piloto não encontrado no campeonato.</div>`; return; }
  const mine = etapas.map(e => ({e, r: e.resultados.find(r => r.codigo === code)})).filter(o => o.r);
  const card = (lbl, val, sub='') => `<div class="card kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const leader = S[0], ahead = S[idx - 1];
  const gap = idx === 0 ? (S[1] ? `${s.pts - S[1].pts} pts à frente do 2º` : 'líder') : `${ahead.pts - s.pts} pts atrás de ${esc(shortName(ahead.codigo).split(' ')[0])}`;
  const vel = s.vel != null ? s.vel.toFixed(1) : '—';
  const c = (lbl, v) => `<td class="r" data-label="${lbl}"><span>${v}</span></td>`;
  el.innerHTML = `
    <button type="button" class="backbtn" data-back>← Classificação</button>
    <div class="panel"><div class="driverhead">
      <span class="bar" style="background:${team ? team.cor : 'var(--border)'}"></span>
      <div><h2>${esc(fullName(code))}</h2>
        <div class="small">${teamTag(code)} · código ${esc(code)}</div></div>
      ${team?.logo ? `<img class="teamlogo" src="${esc(team.logo)}" alt="Logo da equipe ${esc(team.nome)}">` : ''}
    </div></div>
    <div class="kpis">
      ${card('Posição no campeonato', `${idx + 1}º`, gap)}
      ${card('Pontos', s.pts, `${s.etapas} etapa(s)`)}
      ${card('Vitórias', s.wins, `${s.podiums} pódio(s)`)}
      ${card('Melhor volta', fmtTime(s.best))}
      ${card('Maior velocidade', vel, vel !== '—' ? 'km/h' : '')}
      ${card('Batidas / punições', `${s.batidas} / ${s.punicoes}`)}
    </div>
    <div class="panel"><h2>Resultados por etapa</h2>
      <div class="scroll"><table class="stack">
        <tr><th>Etapa</th><th>Kartódromo</th><th class="r">Posição</th><th class="r">Pontos</th><th class="r">Pos. geral${tip('champPosGeral')}</th>
            <th class="r">Melhor volta</th><th class="r">Voltas</th><th class="r">Vel. máx.</th><th class="r">Batidas</th><th class="r">Punições</th><th>Observações</th></tr>
        ${[...mine].reverse().map(({e, r}) => `<tr><td class="rowhead">${esc(e.nome)} · ${brDate(e.data)}</td>
          <td class="hide-sm"><b>${esc(e.nome)}</b> <span class="small">${brDate(e.data)}</span></td><td data-label="Kartódromo"><span>${esc(e.kartodromo)}</span></td>
          ${c('Posição', r.posicao ? `<b>${ord(r.posicao)}</b>` : 'DQ')}${c('Pontos', `<b>${r.pontos}</b>`)}
          ${c('Pos. geral', r.posGeral ? `${r.posGeral}º${e.fieldSize ? ` <span class="small">de ${e.fieldSize}</span>` : ''}` : '—')}
          ${c('Melhor volta', fmtTime(r.melhorVolta))}${c('Voltas', r.voltas ?? '—')}${c('Vel. máx.', r.velMax != null ? r.velMax.toFixed(1) : '—')}
          ${c('Batidas', r.batidas ?? '—')}${c('Punições', r.punicoes ?? '—')}
          <td data-label="Obs." class="${r.penalidade || r.obs ? '' : 'empty'}"><span>${[r.penalidade && '⏱ ' + esc(r.penalidade), r.obs && esc(r.obs)].filter(Boolean).join(' · ') || '—'}</span></td></tr>`).join('')}
      </table></div></div>`;
}

/* ---------- render geral ---------- */
function render(){
  const drivers = driverIndex();
  nameOf = k => drivers.get(k)?.name || k;
  const has = !!champ && (state.races.length > 0 || champ.etapas?.length > 0);
  const code = (location.hash.match(/^#piloto\/(\d+)/) || [])[1];
  $('#empty').hidden = has;
  $('#champ').hidden = !has || !!code;
  $('#driverPage').hidden = !has || !code;
  if(!has) return;
  if(code) renderDriver(code); else renderChamp();
}
// nome do piloto abre os dados dele; o botão voltar do navegador também funciona
document.addEventListener('click', e => {
  const d = e.target.closest('[data-driver]');
  if(d){ location.hash = 'piloto/' + d.dataset.driver; return; }
  if(e.target.closest('[data-back]')) location.hash = '';
});
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

/* ---------- eventos ---------- */
const tipBox = Object.assign(document.createElement('div'), {id:'tipbox', hidden:true, role:'tooltip'});
document.body.appendChild(tipBox);
let tipFor = null;
const canHover = matchMedia('(hover: hover)').matches;
function showTip(btn){
  tipBox.textContent = HELP[btn.dataset.tip] || '';
  tipBox.hidden = false;
  const r = btn.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight;
  let top = r.bottom + 8;
  if(top + h > innerHeight - 8) top = Math.max(8, r.top - h - 8);
  tipBox.style.left = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8) + 'px';
  tipBox.style.top = top + 'px';
  tipFor = btn;
}
function hideTip(){ tipBox.hidden = true; tipFor = null; }
document.addEventListener('click', e => {
  const b = e.target.closest('.tip');
  if(b){ e.preventDefault(); e.stopPropagation(); (tipFor === b && !canHover) ? hideTip() : showTip(b); return; }
  if(!e.target.closest('#tipbox')) hideTip();
}, true);
document.addEventListener('mouseover', e => { const b = e.target.closest('.tip'); if(b && canHover) showTip(b); });
document.addEventListener('mouseout', e => { const b = e.target.closest('.tip'); if(b && canHover && !b.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideTip(); });
addEventListener('scroll', hideTip, true);
addEventListener('resize', hideTip);

Promise.all([connectDb(), loadChamp()]).then(() => { applyTracking(); render(); });
</script>
</body>
